<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Birthday Chamaine</title>
  <style>
    :root {
      --accent-pink: #d8528c;
      --soft-pink: #f8c8dc;
      --glow-pink: #e06698;
      --border-pink: #f2b6cc;
      --text-dark: #3a2e35;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      touch-action: manipulation;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Continuous Rain Canvas */
    #matrixCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Sequence Text Overlay */
    #sequence-overlay {
      z-index: 2;
      pointer-events: none;
      padding: 0 20px;
    }

    .seq-text {
      font-size: clamp(2.5rem, 8vw, 6.5rem);
      font-weight: 800;
      color: #f3a4c4;
      text-shadow: 0 0 20px rgba(224, 102, 152, 0.8), 0 0 40px rgba(224, 102, 152, 0.4);
      letter-spacing: 2px;
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      max-width: 95vw;
      word-wrap: break-word;
    }

    .seq-text.active {
      opacity: 1;
      transform: scale(1);
    }

    .expanding-heart {
      font-size: clamp(5rem, 20vw, 10rem);
      color: #e06698;
      text-shadow: 0 0 30px rgba(224, 102, 152, 0.8);
      display: inline-block;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
    }

    .expanding-heart.expand {
      transform: scale(30);
      opacity: 0;
    }

    #interactive-stage {
      z-index: 4;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
      flex-direction: column;
      background-color: #000000;
    }

    /* Flork Character Styling */
    .bear-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: absolute;
      transition: opacity 0.8s ease, transform 0.8s ease;
      transform: scale(0.85);
    }

    @media (min-width: 600px) {
      .bear-stage {
        transform: scale(1);
      }
    }

    .bear-banner {
      color: #ffe082;
      font-size: 1.8rem;
      font-weight: 800;
      text-shadow: 0 0 12px rgba(216, 82, 140, 0.7);
      margin-bottom: 20px;
      letter-spacing: 2px;
      text-align: center;
    }

    .flork-container {
      width: 220px;
      height: 250px;
      position: relative;
      animation: florkFloat 2.5s infinite alternate ease-in-out;
    }

    @keyframes florkFloat {
      0% { transform: translateY(0px) rotate(-1deg); }
      100% { transform: translateY(-12px) rotate(1deg); }
    }

    .flork-body {
      width: 140px;
      height: 180px;
      background: #ffffff;
      border: 3.5px solid #2d2427;
      border-bottom: none;
      border-radius: 70px 70px 0 0;
      position: absolute;
      bottom: 0;
      left: 40px;
    }

    .flork-hat {
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-bottom: 45px solid #e06698;
      position: absolute;
      top: -32px;
      left: 50px;
      transform: rotate(-10deg);
      z-index: 3;
    }

    .flork-hat-star {
      position: absolute;
      top: -10px;
      left: -7px;
      font-size: 14px;
      color: #fff176;
    }

    .flork-eye {
      width: 20px;
      height: 20px;
      background: #2d2427;
      border-radius: 50%;
      position: absolute;
      top: 45px;
    }
    .flork-eye.left { left: 45px; }
    .flork-eye.right { left: 80px; }

    .flork-eye::after {
      content: '';
      width: 7px;
      height: 7px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 3px;
      left: 4px;
    }

    .flork-blush {
      width: 16px;
      height: 8px;
      background: #f48fb1;
      border-radius: 50%;
      position: absolute;
      top: 68px;
    }
    .flork-blush.left { left: 36px; }
    .flork-blush.right { left: 92px; }

    .flork-smile {
      width: 60px;
      height: 18px;
      border-bottom: 3.5px solid #2d2427;
      border-radius: 0 0 30px 30px;
      position: absolute;
      top: 65px;
      left: 45px;
    }

    .flork-balloon {
      width: 48px;
      height: 58px;
      background: #f48fb1;
      border: 3px solid #2d2427;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      position: absolute;
      top: 5px;
      left: 5px;
      animation: balloonWiggle 2s infinite alternate ease-in-out;
    }

    @keyframes balloonWiggle {
      0% { transform: rotate(-6deg); }
      100% { transform: rotate(6deg); }
    }

    .balloon-string {
      width: 2px;
      height: 75px;
      background: #2d2427;
      position: absolute;
      top: 58px;
      left: 23px;
      transform: rotate(10deg);
    }

    .flork-cake-holder {
      position: absolute;
      bottom: 45px;
      right: -10px;
      z-index: 4;
    }

    .flork-cake {
      width: 80px;
      height: 38px;
      background: #f8bbd0;
      border: 3px solid #2d2427;
      border-radius: 6px;
      position: relative;
    }

    .cake-layer {
      width: 100%;
      height: 14px;
      background: #fff59d;
      border-top: 2.5px solid #2d2427;
      position: absolute;
      bottom: 0;
    }

    .cake-candle {
      width: 7px;
      height: 16px;
      background: #ffffff;
      border: 2px solid #2d2427;
      position: absolute;
      top: -16px;
      left: 35px;
    }

    .cake-flame {
      width: 10px;
      height: 12px;
      background: #ffe082;
      border-radius: 50% 50% 20% 20%;
      position: absolute;
      top: -12px;
      left: -3.5px;
      box-shadow: 0 0 8px #ffe082;
      animation: flameFlicker 0.4s infinite alternate ease-in-out;
    }

    /* Heart Collage */
    .heart-explosion {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .heart-photo {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 8px;
      border: 2px solid #ffffff;
      box-shadow: 0 4px 12px rgba(216, 82, 140, 0.3);
      background-size: cover;
      background-position: center;
      background-color: var(--soft-pink);
      opacity: 0;
      transform: scale(0) translate(0, 0) rotate(0deg);
      transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @media (min-width: 600px) {
      .heart-photo {
        width: 80px;
        height: 80px;
        border-radius: 12px;
        border-width: 3px;
      }
    }

    /* Drama Button */
    .drama-btn {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translate(-50%, 20px);
      z-index: 10;
      background: rgba(224, 102, 152, 0.45);
      border: 1.5px solid #f2b6cc;
      color: #f8c8dc;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(224, 102, 152, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: all 0.8s ease;
      pointer-events: auto;
      white-space: nowrap;
    }

    .drama-btn.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .drama-btn:active {
      background: rgba(224, 102, 152, 0.8);
      transform: translate(-50%, 0) scale(0.96);
    }

    /* Galaxy Page Section */
    #galaxyPage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      display: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      background: #000000;
    }

    #galaxyPage.active {
      display: block;
      opacity: 1;
    }

    /* Back Button on Galaxy Page */
    .back-btn {
      position: absolute;
      top: 25px;
      left: 20px;
      z-index: 30;
      background: rgba(224, 102, 152, 0.4);
      border: 1px solid var(--border-pink);
      color: #f8c8dc;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(224, 102, 152, 0.4);
      transition: all 0.3s ease;
    }

    .back-btn:active {
      background: rgba(224, 102, 152, 0.8);
      transform: scale(0.95);
    }

    #start-screen {
      position: absolute;
      z-index: 100;
      background: rgba(15, 10, 12, 0.85);
      backdrop-filter: blur(8px);
      color: #f48fb1;
      cursor: pointer;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      border: 1px solid var(--border-pink);
      padding: 16px 32px;
      border-radius: 30px;
      box-shadow: 0 0 20px rgba(224, 102, 152, 0.3);
      transition: all 0.3s ease;
    }

    #start-screen:active {
      transform: scale(0.95);
      box-shadow: 0 0 25px rgba(224, 102, 152, 0.6);
    }
  </style>
  <!-- Three.js for 3D Galaxy Page -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Audio -->
  <audio id="bgMusic" loop preload="auto">
    <source src="https://ia801503.us.archive.org/15/items/ariana-grande-justin-bieber-stuck-with-u/Ariana%20Grande%20%26%20Justin%20Bieber%20-%20Stuck%20with%20U.mp3" type="audio/mpeg">
  </audio>

  <div class="screen" id="audio-prompt-screen">
    <button id="start-screen">Tap to Start 💕</button>
  </div>

  <canvas id="matrixCanvas"></canvas>

  <div class="screen" id="sequence-overlay">
    <div id="seqDisplay" class="seq-text"></div>
  </div>

  <div class="screen" id="interactive-stage">
    
    <!-- Flork Stage -->
    <div class="bear-stage" id="bearStage">
      <div class="bear-banner">HAPPY<br>BIRTHDAY</div>
      <div class="flork-container">
        <div class="flork-balloon">
          <div class="balloon-string"></div>
        </div>
        <div class="flork-body">
          <div class="flork-hat"><span class="flork-hat-star">★</span></div>
          <div class="flork-eye left"></div>
          <div class="flork-eye right"></div>
          <div class="flork-blush left"></div>
          <div class="flork-blush right"></div>
          <div class="flork-smile"></div>
        </div>
        <div class="flork-cake-holder">
          <div class="flork-cake">
            <div class="cake-candle"><div class="cake-flame"></div></div>
            <div class="cake-layer"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Heart Explosion Collage Container -->
    <div class="heart-explosion" id="heartExplosion"></div>

    <!-- Drama Button -->
    <button class="drama-btn" id="dramaBtn">tap here to see drama 😂</button>

  </div>

  <!-- Galaxy Page Wrapper -->
  <div id="galaxyPage">
    <button class="back-btn" id="backBtn">⬅ BACK TO MAIN</button>
  </div>

  <script>
    const audioPromptScreen = document.getElementById('audio-prompt-screen');
    const startBtn = document.getElementById('start-screen');
    const bgMusic = document.getElementById('bgMusic');

    startBtn.addEventListener('click', () => {
      bgMusic.volume = 0.6;
      bgMusic.play().catch(() => {});
      audioPromptScreen.style.opacity = '0';
      setTimeout(() => {
        audioPromptScreen.style.display = 'none';
        runSequence();
      }, 500);
    });

    const matrixCanvas = document.getElementById('matrixCanvas');
    const mCtx = matrixCanvas.getContext('2d');

    function resizeMatrix() {
      matrixCanvas.width = window.innerWidth;
      matrixCanvas.height = window.innerHeight;
    }
    resizeMatrix();

    const flowText = "I LOVE YOU ♥ CHARMY ♥ ";
    const fontSize = Math.max(12, Math.floor(window.innerWidth / 25));
    let columns = Math.floor(matrixCanvas.width / fontSize);
    let drops = Array(columns).fill(1);
    let textIndices = Array(columns).fill(0);

    function drawMatrix() {
      mCtx.fillStyle = 'rgba(0, 0, 0, 0.15)';
      mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);

      mCtx.fillStyle = '#e06698';
      mCtx.font = 'bold ' + fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        let charIndex = textIndices[i] % flowText.length;
        const char = flowText.charAt(charIndex);
        
        mCtx.fillText(char, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975) {
          drops[i] = 0;
          textIndices[i] = 0;
        }
        drops[i]++;
        textIndices[i]++;
      }
    }

    let matrixInterval = setInterval(drawMatrix, 40);

    const seqDisplay = document.getElementById('seqDisplay');
    const sequence = [
      { text: '3', duration: 1000 },
      { text: '2', duration: 1000 },
      { text: '1', duration: 1000 },
      { text: 'HAPPY', duration: 900 },
      { text: 'BIRTHDAY', duration: 900 },
      { text: 'CHAMYYYYYYY!', duration: 1200 },
      { text: '♥', duration: 1200, isHeart: true }
    ];

    function runSequence(index = 0) {
      if (index >= sequence.length) return;

      const item = sequence[index];
      seqDisplay.classList.remove('active');
      
      setTimeout(() => {
        seqDisplay.innerHTML = item.text;

        if (item.isHeart) {
          seqDisplay.classList.add('expanding-heart');
          seqDisplay.classList.add('active');

          setTimeout(() => {
            seqDisplay.classList.add('expand');
            setTimeout(() => {
              startStageTransition();
            }, 800);
          }, 600);

        } else {
          seqDisplay.classList.add('active');
          setTimeout(() => {
            runSequence(index + 1);
          }, item.duration);
        }

      }, 100);
    }

    function startStageTransition() {
      seqDisplay.style.opacity = '0';

      setTimeout(() => {
        document.getElementById('interactive-stage').style.opacity = '1';
        document.getElementById('interactive-stage').style.pointerEvents = 'auto';

        const bearStage = document.getElementById('bearStage');

        setTimeout(() => {
          bearStage.style.opacity = '0';
          setTimeout(() => {
            bearStage.style.display = 'none';
            explodeToHeartGrid();
          }, 800);
        }, 3000);

      }, 800);
    }

    const heartExplosion = document.getElementById('heartExplosion');
    const dramaBtn = document.getElementById('dramaBtn');
    const totalPhotos = 36;

    /* Scaled Parametric Heart Formula for Mobile */
    function getHeartPoint(t) {
      const isMobile = window.innerWidth < 600;
      const scale = isMobile ? Math.min(window.innerWidth / 42, 10) : 16;
      
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      return { x: x * scale, y: y * scale };
    }

    for (let i = 0; i < totalPhotos; i++) {
      const imgDiv = document.createElement('div');
      imgDiv.className = 'heart-photo';
      imgDiv.style.backgroundImage = `url('pic${(i % 4) + 1}.png')`;
      
      const t = (i / totalPhotos) * Math.PI * 2;
      const pos = getHeartPoint(t);
      
      const randomRot = (Math.random() - 0.5) * 20; 
      const randomScale = 0.85 + Math.random() * 0.2;

      imgDiv.dataset.targetX = pos.x;
      imgDiv.dataset.targetY = pos.y;
      imgDiv.dataset.rot = randomRot;
      imgDiv.dataset.scale = randomScale;

      heartExplosion.appendChild(imgDiv);
    }

    function explodeToHeartGrid() {
      const photos = document.querySelectorAll('.heart-photo');
      photos.forEach((photo, index) => {
        setTimeout(() => {
          const x = photo.dataset.targetX;
          const y = photo.dataset.targetY;
          const rot = photo.dataset.rot;
          const scale = photo.dataset.scale;

          photo.style.opacity = '1';
          photo.style.transform = `translate(${x}px, ${y}px) scale(${scale}) rotate(${rot}deg)`;
        }, index * 25);
      });

      setTimeout(() => {
        dramaBtn.classList.add('show');
      }, 1200);
    }

    const galaxyPage = document.getElementById('galaxyPage');
    const backBtn = document.getElementById('backBtn');
    const interactiveStage = document.getElementById('interactive-stage');

    dramaBtn.addEventListener('click', () => {
      interactiveStage.style.opacity = '0';
      interactiveStage.style.pointerEvents = 'none';

      galaxyPage.classList.add('active');
      init3DGalaxy();
    });

    backBtn.addEventListener('click', () => {
      galaxyPage.classList.remove('active');
      interactiveStage.style.opacity = '0';
      interactiveStage.style.pointerEvents = 'none';

      seqDisplay.classList.remove('expanding-heart', 'expand', 'active');
      seqDisplay.style.opacity = '1';
      seqDisplay.innerHTML = '';

      const bearStage = document.getElementById('bearStage');
      bearStage.style.display = 'flex';
      bearStage.style.opacity = '1';

      const photos = document.querySelectorAll('.heart-photo');
      photos.forEach(photo => {
        photo.style.opacity = '0';
        photo.style.transform = 'scale(0) translate(0, 0) rotate(0deg)';
      });

      dramaBtn.classList.remove('show');

      audioPromptScreen.style.display = 'flex';
      audioPromptScreen.style.opacity = '1';
    });

    let scene, camera, renderer, galaxyGroup, center3DHeart;

    function init3DGalaxy() {
      if (renderer) return;

      scene = new THREE.Scene();
      
      const aspect = window.innerWidth / window.innerHeight;
      const fov = aspect < 1 ? 75 : 60; // Wider FOV for vertical smartphone screens
      
      camera = new THREE.PerspectiveCamera(fov, aspect, 0.1, 1000);
      camera.position.set(0, 15, 38);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      galaxyPage.appendChild(renderer.domElement);

      galaxyGroup = new THREE.Group();
      scene.add(galaxyGroup);

      // 3D Particle Heart
      const heartPoints = [];
      const heartColors = [];
      const heartParticleCount = 1800;
      const colorGlowPink = new THREE.Color('#ff4d88');
      const colorSoftPink = new THREE.Color('#f8c8dc');

      for (let i = 0; i < heartParticleCount; i++) {
        const t = Math.PI * 2 * Math.random();
        const u = (Math.random() - 0.5) * 2;
        
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        let z = u * 4;

        const scale = 0.35;
        x *= scale;
        y *= scale;
        z *= scale;

        x += (Math.random() - 0.5) * 0.4;
        y += (Math.random() - 0.5) * 0.4;
        z += (Math.random() - 0.5) * 0.4;

        heartPoints.push(x, y, z);

        const mixedColor = colorGlowPink.clone().lerp(colorSoftPink, Math.random());
        heartColors.push(mixedColor.r, mixedColor.g, mixedColor.b);
      }

      const heartGeometry = new THREE.BufferGeometry();
      heartGeometry.setAttribute('position', new THREE.Float32BufferAttribute(heartPoints, 3));
      heartGeometry.setAttribute('color', new THREE.Float32BufferAttribute(heartColors, 3));

      const heartMaterial = new THREE.PointsMaterial({
        size: window.innerWidth < 600 ? 0.35 : 0.45,
        vertexColors: true,
        transparent: true,
        opacity: 0.95
      });

      center3DHeart = new THREE.Points(heartGeometry, heartMaterial);
      galaxyGroup.add(center3DHeart);

      // Spiral Galaxy Particles
      const particleCount = 3000;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      const colorPink = new THREE.Color('#e06698');

      for (let i = 0; i < particleCount; i++) {
        const radius = Math.random() * 24 + 6;
        const spinAngle = radius * 1.5;
        const branchAngle = ((i % 3) * 2 * Math.PI) / 3;

        const randomX = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.5 * radius;
        const randomY = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.5 * radius;
        const randomZ = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.5 * radius;

        positions[i * 3] = Math.cos(spinAngle + branchAngle) * radius + randomX;
        positions[i * 3 + 1] = randomY;
        positions[i * 3 + 2] = Math.sin(spinAngle + branchAngle) * radius + randomZ;

        const mixedColor = colorPink.clone().lerp(colorSoftPink, Math.random());
        colors[i * 3] = mixedColor.r;
        colors[i * 3 + 1] = mixedColor.g;
        colors[i * 3 + 2] = mixedColor.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: window.innerWidth < 600 ? 0.25 : 0.3,
        vertexColors: true,
        transparent: true,
        opacity: 0.85
      });

      const galaxyPoints = new THREE.Points(geometry, material);
      galaxyGroup.add(galaxyPoints);

      let clock = new THREE.Clock();

      function animateGalaxy() {
        requestAnimationFrame(animateGalaxy);
        const elapsedTime = clock.getElapsedTime();

        galaxyGroup.rotation.y += 0.003;

        if (center3DHeart) {
          const heartPulse = 1 + Math.sin(elapsedTime * 3) * 0.08;
          center3DHeart.scale.set(heartPulse, heartPulse, heartPulse);
        }

        renderer.render(scene, camera);
      }
      animateGalaxy();
    }

    window.addEventListener('resize', () => {
      resizeMatrix();
      if (renderer && camera) {
        const aspect = window.innerWidth / window.innerHeight;
        camera.fov = aspect < 1 ? 75 : 60;
        camera.aspect = aspect;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });
  </script>
</body>
</html>
